<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python URL Shortener</title>
    <link rel="stylesheet" href = "static\style.css">
</head>
<body>
    <h2>Python URL Shortener</h2>
    <form method="POST">
        <input type="url" name="long_url" placeholder="Enter URL to shorten" required>
        <input type="submit" value="Shorten">
    </form>

    {% if short_url %}
    <div class="short-url">
        <p><strong>Short URL:</strong> <a href="{{ short_url }}" target="_blank">{{ short_url }}</a></p>
    </div>
    {% endif %} 
</body>
</html>
